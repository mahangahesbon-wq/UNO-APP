<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00ff66" />
  <meta name="description" content="Konami-inspired UNO football striker game" />
  <title>KONAMI UNO FOOTBALL</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #05070d;
      --panel: #111824;
      --accent: #39ff14;
      --accent-2: #00d2ff;
      --danger: #ff2d75;
      --gold: #ffd75f;
      --text: #e9f5ff;
      --dark: #111111;
      --shadow: rgba(57, 255, 20, 0.35);
      --scan: rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0, 255, 140, 0.12), transparent 30%),
        linear-gradient(180deg, #05070d, #0a1018 50%, #05070d);
      color: var(--text);
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(100%, 940px);
      background: linear-gradient(180deg, rgba(17,24,36,0.98), rgba(8,11,18,0.96));
      border: 3px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 30px var(--shadow), inset 0 0 18px rgba(0,255,140,0.08);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10, 16, 24, 0.9);
      border-bottom: 2px solid rgba(57,255,20,0.3);
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Verdana', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 900;
      font-size: 0.92rem;
      min-width: 140px;
    }

    .brand .green { color: var(--accent); }
    .brand .blue { color: var(--accent-2); }

    .score {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Verdana', sans-serif;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: 0.06em;
    }

    .score strong {
      color: var(--accent-2);
    }

    .score .away {
      color: var(--danger);
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button {
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      background: #1a2437;
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(57,255,20,0.5);
      box-shadow: 0 0 12px rgba(57,255,20,0.18);
    }

    #startBtn { background: var(--accent); color: #08160d; border-color: var(--accent); }
    #resetBtn { background: #2b3a4e; color: #fff; }
    #toggleAudio {
      background: #1d1e38;
      color: var(--gold);
      border-color: var(--gold);
    }
    #hostBtn { background: #00c6ff; color: #051826; border-color: #00c6ff; }
    #joinBtn { background: #ffb700; color: #1d1200; border-color: #ffb700; }
    #connectBtn { background: #17d673; color: #052b17; border-color: #17d673; }
    #copyCodeBtn { background: #3d4a7a; color: white; border-color: #3d4a7a; }

    .multiplayer-panel {
      position: relative;
      z-index: 1;
      padding: 10px 14px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .multiplayer-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .multiplayer-row input {
      min-width: 180px;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid rgba(57,255,20,0.35);
      background: rgba(10, 16, 24, 0.9);
      color: white;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .multiplayer-row input::placeholder {
      color: #9aa4d2;
    }

    #connectionStatus {
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted, #dfe7ff);
      min-height: 20px;
      font-weight: 700;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      color: #d5d8e9;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 14px 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .game-shell { padding: 14px; position: relative; z-index: 1; }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      background: linear-gradient(#0d4d2e, #0d762f 60%, #0d4d2e);
      border: 3px solid rgba(57,255,20,0.8);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3), 0 0 18px rgba(57,255,20,0.18);
      image-rendering: pixelated;
    }

    .status {
      margin-top: 12px;
      min-height: 55px;
      background: rgba(7, 12, 18, 0.95);
      border: 2px solid var(--accent-2);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
      color: var(--accent-2);
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: inset 0 0 12px rgba(0,210,255,0.12);
    }

    .touch-controls {
      display: none;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .touch-pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
    }

    .touch-btn {
      width: 48px;
      height: 48px;
      background: #202d41;
      border: 2px solid #5d8cff;
      color: white;
      border-radius: 10px;
      padding: 0;
      display: grid;
      place-items: center;
      user-select: none;
      font-size: 1.1rem;
    }

    #shootBtn {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--danger), #ff6b7a);
      border: 3px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 24px rgba(255, 45, 117, 0.25);
      color: white;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .install-banner {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: none;
      z-index: 99;
    }

    .install-banner.show { display: block; }

    #installBtn {
      background: var(--gold);
      color: #1d1200;
      box-shadow: 0 8px 22px rgba(255, 183, 0, 0.4);
    }

    @media (max-width: 720px) {
      .topbar { flex-wrap: wrap; justify-content: center; }
      .brand { min-width: 0; }
      .touch-controls { display: flex; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="green">KONAMI</span> <span class="blue">GOAL</span></div>
      <div class="score">
        <span><strong>KENYA</strong> <span id="homeScore">0</span></span>
        <span class="away"><span id="awayScore">0</span> <strong>BOT</strong></span>
      </div>
      <div class="controls">
        <button id="toggleAudio" type="button">🎵 Music: OFF</button>
        <button id="startBtn" type="button">Match Kickoff</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </div>

    <div class="multiplayer-panel">
      <div class="multiplayer-row">
        <button id="hostBtn" type="button">Host Match</button>
        <button id="joinBtn" type="button">Join Match</button>
        <input id="joinCode" type="text" placeholder="Enter room code" maxlength="40" />
        <button id="connectBtn" type="button">Connect</button>
        <button id="copyCodeBtn" type="button">Copy Code</button>
      </div>
      <div id="connectionStatus">Offline mode: local match only</div>
    </div>

    <div class="stats">
      <div>Clock: <span id="timerText">90</span>s</div>
      <div>Difficulty: <span id="difficultyText">Normal</span></div>
      <div>Mode: <span id="modeText">Offline</span></div>
    </div>

    <div class="game-shell">
      <canvas id="pitchCanvas" width="800" height="500" aria-label="Konami styled football game"></canvas>
      <div id="statusText" class="status">🎮 KONAMI MODE READY — Use arrow keys or on-screen controls.</div>
    </div>

    <div class="touch-controls">
      <div class="touch-pad">
        <div></div>
        <button class="touch-btn" data-key="ArrowUp">▲</button>
        <div></div>
        <button class="touch-btn" data-key="ArrowLeft">◀</button>
        <button class="touch-btn" data-key="ArrowDown">▼</button>
        <button class="touch-btn" data-key="ArrowRight">▶</button>
      </div>
      <button id="shootBtn" type="button">SHOOT</button>
    </div>
  </div>

  <div id="installBanner" class="install-banner">
    <button id="installBtn" type="button">Install App</button>
  </div>

  <script>
    const canvas = document.getElementById('pitchCanvas');
    const ctx = canvas.getContext('2d');

    const statusText = document.getElementById('statusText');
    const homeScoreEl = document.getElementById('homeScore');
    const awayScoreEl = document.getElementById('awayScore');
    const timerText = document.getElementById('timerText');
    const difficultyText = document.getElementById('difficultyText');
    const modeText = document.getElementById('modeText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toggleAudioBtn = document.getElementById('toggleAudio');
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const shootBtn = document.getElementById('shootBtn');
    const connectionStatusEl = document.getElementById('connectionStatus');
    const joinCodeInput = document.getElementById('joinCode');
    const hostBtn = document.getElementById('hostBtn');
    const joinBtn = document.getElementById('joinBtn');
    const connectBtn = document.getElementById('connectBtn');
    const copyCodeBtn = document.getElementById('copyCodeBtn');

    const FIELD = { width: canvas.width, height: canvas.height };
    const keys = {};
    const localStorageKey = 'konami_uno_game_v1';
    const konamiSequence = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    const state = {
      running: false,
      timer: 90,
      difficulty: 1,
      homeScore: 0,
      awayScore: 0,
      lastTimestamp: 0,
      musicOn: localStorage.getItem('uno_music') === 'on',
      installPrompt: null,
      winner: null,
      remoteMode: false,
      peer: null,
      conn: null,
      roomCode: null,
      role: 'solo',
      syncedAt: 0,
      konamiActive: false,
      konamiIndex: 0,
      mode: 'offline'
    };

    const player = {
      x: 110,
      y: FIELD.height / 2,
      radius: 16,
      speed: 5.3,
      color: '#00f0ff'
    };

    const remotePlayer = {
      x: FIELD.width - 110,
      y: FIELD.height / 2,
      radius: 16,
      color: '#ff2d75'
    };

    const opponent = {
      x: FIELD.width - 110,
      y: FIELD.height / 2,
      radius: 16,
      speed: 3.6,
      color: '#ff2d75'
    };

    const ball = {
      x: FIELD.width / 2,
      y: FIELD.height / 2,
      radius: 12,
      vx: 0,
      vy: 0
    };

    function setConnectionStatus(msg) {
      connectionStatusEl.textContent = msg;
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    function setMode(mode) {
      state.mode = mode;
      modeText.textContent = mode === 'online' ? 'Online' : 'Offline';
      setConnectionStatus(mode === 'online' ? 'Online mode active' : 'Offline mode: local match only');
    }

    function renderScore() {
      homeScoreEl.textContent = state.homeScore;
      awayScoreEl.textContent = state.awayScore;
      timerText.textContent = Math.max(0, Math.ceil(state.timer));

      if (state.difficulty >= 2.2) difficultyText.textContent = 'Hard';
      else if (state.difficulty >= 1.5) difficultyText.textContent = 'Medium';
      else difficultyText.textContent = 'Normal';

      modeText.textContent = state.remoteMode ? 'Online' : 'Offline';
    }

    function saveProgress() {
      localStorage.setItem(localStorageKey, JSON.stringify({
        homeScore: state.homeScore,
        awayScore: state.awayScore,
        timer: state.timer,
        mode: state.remoteMode ? 'online' : 'offline'
      }));
    }

    function restoreProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(localStorageKey) || '{}');
        if (saved.homeScore != null) state.homeScore = saved.homeScore;
        if (saved.awayScore != null) state.awayScore = saved.awayScore;
        if (saved.timer != null) state.timer = saved.timer;
        if (saved.mode === 'online') state.remoteMode = true;
      } catch (err) {
        console.warn('Could not restore state', err);
      }
    }

    function resetBall() {
      ball.x = FIELD.width / 2;
      ball.y = FIELD.height / 2;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * (2.2 + Math.random() * 1.8);
      ball.vy = (Math.random() > 0.5 ? 1 : -1) * (1.8 + Math.random() * 1.6);
    }

    function resetPositions() {
      player.x = 110;
      player.y = FIELD.height / 2;
      opponent.x = FIELD.width - 110;
      opponent.y = FIELD.height / 2;
      remotePlayer.x = FIELD.width - 110;
      remotePlayer.y = FIELD.height / 2;
      resetBall();
    }

    function resetGame() {
      state.running = false;
      state.timer = 90;
      state.homeScore = 0;
      state.awayScore = 0;
      state.winner = null;
      startBtn.textContent = 'Match Kickoff';
      setStatus('🎤 READY — Enter the field.');
      renderScore();
      resetPositions();
      saveProgress();
      sendPeerMessage({ type: 'reset' });
    }

    function startMatch() {
      if (state.winner) state.winner = null;
      state.running = !state.running;
      if (state.running) {
        setStatus(state.konamiActive ? '🔥 KONAMI MODE ACTIVE — SPEED BOOST ON!' : '🚀 Kickoff! Press space or tap SHOOT to strike.');
        startBtn.textContent = 'Pause Match';
        sendPeerMessage({ type: 'start' });
      } else {
        setStatus('⏸️ Match paused. Press kickoff when ready.');
        startBtn.textContent = 'Match Kickoff';
      }
    }

    function updateDifficulty() {
      const elapsed = 90 - state.timer;
      state.difficulty = 1 + Math.min(2.5, elapsed / 36);
      opponent.speed = 3.5 + state.difficulty * 0.8;
      player.speed = state.konamiActive ? 7.4 : 5.3;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function movePlayer() {
      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp || keys.w) dy -= 1;
      if (keys.ArrowDown || keys.s) dy += 1;
      if (keys.ArrowLeft || keys.a) dx -= 1;
      if (keys.ArrowRight || keys.d) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy) || 1;
        const boost = state.konamiActive ? 1.55 : 1;
        player.x += (dx / length) * player.speed * boost;
        player.y += (dy / length) * player.speed * boost;
      }

      player.x = clamp(player.x, 28, FIELD.width - 28);
      player.y = clamp(player.y, 28, FIELD.height - 28);
    }

    function moveOpponentAI() {
      const targetX = player.x < FIELD.width / 2 ? FIELD.width * 0.65 : FIELD.width * 0.75;
      const targetY = player.y;
      const dx = targetX - opponent.x;
      const dy = targetY - opponent.y;
      const dist = Math.hypot(dx, dy) || 1;
      const turbo = state.konamiActive ? 1.25 : 1;

      if (dist > 10) {
        opponent.x += (dx / dist) * opponent.speed * turbo;
        opponent.y += (dy / dist) * opponent.speed * turbo;
      }

      opponent.x = clamp(opponent.x, FIELD.width * 0.55, FIELD.width - 28);
      opponent.y = clamp(opponent.y, 28, FIELD.height - 28);
    }

    function sendPeerMessage(payload) {
      if (state.conn && state.conn.open) {
        state.conn.send(payload);
      }
    }

    function handlePeerData(data) {
      if (!data || !data.type) return;

      if (data.type === 'player') {
        remotePlayer.x = data.x;
        remotePlayer.y = data.y;
        if (data.shoot) shootBallForRemote();
      }

      if (data.type === 'score') {
        state.homeScore = data.homeScore;
        state.awayScore = data.awayScore;
        renderScore();
      }

      if (data.type === 'reset') resetGame();
      if (data.type === 'start' && !state.running) startMatch();
      if (data.type === 'shoot') shootBallForRemote();
    }

    function shootBall(strengthBoost = 1) {
      const dx = ball.x - player.x;
      const dy = ball.y - player.y;
      const dist = Math.hypot(dx, dy) || 1;

      if (dist < player.radius + ball.radius + 25) {
        const power = (state.konamiActive ? 9.2 : 6.8) * strengthBoost;
        ball.vx = (dx / dist) * power + 1.2;
        ball.vy = (dy / dist) * power;
        sendPeerMessage({ type: 'shoot' });
      }
    }

    function shootBallForRemote() {
      const targetX = player.x + 40;
      const targetY = ball.y;
      ball.vx = (targetX - ball.x) * 0.06 + 4.2;
      ball.vy = (targetY - ball.y) * 0.06;
    }

    function handleBallGoal() {
      if (ball.x - ball.radius <= 0) {
        state.awayScore += 1;
        setStatus('🎉 BOT SCORES!');
        sendPeerMessage({ type: 'score', homeScore: state.homeScore, awayScore: state.awayScore });
        resetBall();
      }

      if (ball.x + ball.radius >= FIELD.width) {
        state.homeScore += 1;
        setStatus('⚽ KENYA SCORES!');
        sendPeerMessage({ type: 'score', homeScore: state.homeScore, awayScore: state.awayScore });
        resetBall();
      }

      renderScore();
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y <= ball.radius || ball.y >= FIELD.height - ball.radius) {
        ball.vy *= -1;
      }

      if (ball.x <= ball.radius || ball.x >= FIELD.width - ball.radius) {
        handleBallGoal();
      }

      const pDx = ball.x - player.x;
      const pDy = ball.y - player.y;
      const pDist = Math.hypot(pDx, pDy);
      if (pDist < player.radius + ball.radius) {
        const angle = Math.atan2(pDy, pDx);
        const impact = state.konamiActive ? 1.7 : 1.35;
        ball.vx = Math.cos(angle) * 7.8 * impact;
        ball.vy = Math.sin(angle) * 7.8 * impact;
      }

      const oDx = ball.x - opponent.x;
      const oDy = ball.y - opponent.y;
      const oDist = Math.hypot(oDx, oDy);
      if (oDist < opponent.radius + ball.radius) {
        const angle = Math.atan2(oDy, oDx);
        ball.vx = Math.cos(angle) * 7.3;
        ball.vy = Math.sin(angle) * 7.3;
      }

      if (!state.remoteMode && Math.random() < 0.02) {
        const tdx = ball.x - opponent.x;
        const tdy = ball.y - opponent.y;
        if (Math.abs(tdx) < 140 && Math.abs(tdy) < 90) {
          ball.vx += (ball.x < FIELD.width / 2 ? 1 : -1) * 0.18;
        }
      }
    }

    function updateRemoteState() {
      if (!state.remoteMode || !state.conn || !state.conn.open) return;
      if (performance.now() - state.syncedAt > 80) {
        state.syncedAt = performance.now();
        sendPeerMessage({ type: 'player', x: player.x, y: player.y, shoot: !!keys.Space });
      }
    }

    function updateMatch(delta) {
      if (!state.running) return;

      state.timer -= delta;
      updateDifficulty();

      if (state.timer <= 0) {
        state.running = false;
        state.timer = 0;
        if (state.homeScore > state.awayScore) {
          state.winner = 'KENYA';
          setStatus('🏆 FULL TIME: KENYA WINS!');
        } else if (state.awayScore > state.homeScore) {
          state.winner = 'BOT';
          setStatus('🏆 FULL TIME: BOT WINS!');
        } else {
          state.winner = 'DRAW';
          setStatus('🤝 FULL TIME: DRAW GAME');
        }
        startBtn.textContent = 'Play Again';
      }

      movePlayer();

      if (state.remoteMode && state.conn && state.conn.open) {
        opponent.x = remotePlayer.x;
        opponent.y = remotePlayer.y;
        updateRemoteState();
      } else {
        moveOpponentAI();
      }

      updateBall();
      renderScore();
      saveProgress();
    }

    function drawField() {
      ctx.clearRect(0, 0, FIELD.width, FIELD.height);
      ctx.fillStyle = '#0c401d';
      ctx.fillRect(0, 0, FIELD.width, FIELD.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.strokeRect(20, 20, FIELD.width - 40, FIELD.height - 40);

      ctx.beginPath();
      ctx.moveTo(FIELD.width / 2, 20);
      ctx.lineTo(FIELD.width / 2, FIELD.height - 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(FIELD.width / 2, FIELD.height / 2, 70, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(FIELD.width / 2, FIELD.height / 2, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.fillStyle = '#edf7ff';
      ctx.fillRect(20, 150, 60, 200);
      ctx.fillRect(FIELD.width - 80, 150, 60, 200);

      ctx.fillStyle = '#f4f5f7';
      ctx.fillRect(20, 210, 18, 80);
      ctx.fillRect(FIELD.width - 38, 210, 18, 80);
    }

    function drawPlayerSprite(x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.lineTo(x + (label === 'player' ? 18 : -18), y + 34);
      ctx.stroke();
    }

    function drawBall() {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ff2d75';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawCenterMessage() {
      if (state.running) return;
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(0, 0, FIELD.width, FIELD.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 26px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(state.winner ? 'MATCH OVER' : 'READY TO PLAY', FIELD.width / 2, FIELD.height / 2 - 10);
      ctx.fillStyle = '#dfe7ff';
      ctx.font = '600 18px Segoe UI';
      ctx.fillText(state.winner ? `${state.winner} WINS` : 'Press Match Kickoff', FIELD.width / 2, FIELD.height / 2 + 22);
    }

    function render() {
      drawField();
      drawPlayerSprite(player.x, player.y, player.color, 'player');
      const enemyX = state.remoteMode ? remotePlayer.x : opponent.x;
      const enemyY = state.remoteMode ? remotePlayer.y : opponent.y;
      drawPlayerSprite(enemyX, enemyY, '#ff2d75', 'bot');
      drawBall();
      drawCenterMessage();
    }

    function gameLoop(timestamp) {
      const delta = Math.min((timestamp - state.lastTimestamp) / 1000 || 0.016, 0.033);
      state.lastTimestamp = timestamp;
      updateMatch(delta);
      render();
      requestAnimationFrame(gameLoop);
    }

    function detectKonamiCode(eventKey) {
      const expected = konamiSequence[state.konamiIndex];
      const key = eventKey.length === 1 ? eventKey.toLowerCase() : eventKey;
      const value = (key === 'b' || key === 'a') ? key.toLowerCase() : eventKey;

      if (value === expected) {
        state.konamiIndex += 1;
        if (state.konamiIndex === konamiSequence.length) {
          state.konamiActive = !state.konamiActive;
          state.konamiIndex = 0;
          if (state.konamiActive) {
            setStatus('🔥 KONAMI MODE ACTIVATED — TURBO BOOST ENABLED');
            setConnectionStatus('CHEAT MODE: Turbo boost online');
          } else {
            setStatus('💠 KONAMI MODE OFF — BACK TO NORMAL');
          }
        }
      } else {
        state.konamiIndex = 0;
      }
    }

    function setupConnection(connection) {
      state.conn = connection;
      state.remoteMode = true;
      state.role = connection.metadata && connection.metadata.role ? connection.metadata.role : 'guest';
      setConnectionStatus(`Connected: ${state.role === 'host' ? 'Hosting room' : 'Joined room'} — ${state.roomCode || 'connected'}`);
      setStatus('🎮 Remote match connected! You can now play with a friend.');

      state.conn.on('data', (data) => {
        handlePeerData(data);
      });

      state.conn.on('close', () => {
        state.remoteMode = false;
        state.conn = null;
        setConnectionStatus('Disconnected: back to local match mode');
        setStatus('🔌 Connection lost. Solo mode restored.');
      });
    }

    function createPeer() {
      if (!window.Peer) {
        setConnectionStatus('PeerJS unavailable. Internet multiplayer is disabled.');
        return;
      }

      if (state.peer) return;

      state.peer = new Peer({
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        path: '/'
      });

      state.peer.on('open', (id) => {
        state.roomCode = id;
        state.role = 'host';
        setConnectionStatus(`Room ready: ${id} — share this code with a friend`);
        setStatus('🎮 Room created. Share the code and invite friends or family.');
      });

      state.peer.on('connection', (conn) => {
        setupConnection(conn);
      });

      state.peer.on('error', (err) => {
        console.error(err);
        setConnectionStatus(`Connection error: ${err.message}`);
      });
    }

    hostBtn.addEventListener('click', () => {
      state.remoteMode = true;
      setMode('online');
      createPeer();
    });

    joinBtn.addEventListener('click', () => {
      state.remoteMode = true;
      setMode('online');
      setConnectionStatus('Join mode enabled — enter host code and click Connect');
    });

    connectBtn.addEventListener('click', () => {
      const code = joinCodeInput.value.trim();
      if (!code) {
        setConnectionStatus('Enter a room code first');
        return;
      }
      if (!state.peer) createPeer();
      const conn = state.peer.connect(code, { metadata: { role: 'guest' } });
      state.roomCode = code;
      setupConnection(conn);
      setConnectionStatus(`Connecting to room: ${code}`);
    });

    copyCodeBtn.addEventListener('click', async () => {
      if (!state.roomCode) {
        setConnectionStatus('Create or join a room first');
        return;
      }

      try {
        await navigator.clipboard.writeText(state.roomCode);
        setConnectionStatus(`Room code copied: ${state.roomCode}`);
      } catch (err) {
        setConnectionStatus(`Copy failed. Share manually: ${state.roomCode}`);
      }
    });

    startBtn.addEventListener('click', () => {
      if (!state.running && state.timer === 0) {
        state.timer = 90;
        state.homeScore = 0;
        state.awayScore = 0;
        state.winner = null;
        resetPositions();
        renderScore();
      }
      startMatch();
    });

    resetBtn.addEventListener('click', () => {
      resetGame();
    });

    toggleAudioBtn.addEventListener('click', () => {
      state.musicOn = !state.musicOn;
      localStorage.setItem('uno_music', state.musicOn ? 'on' : 'off');
      toggleAudioBtn.textContent = state.musicOn ? '🎵 Music: ON' : '🎵 Music: OFF';
      setStatus(state.musicOn ? '🎧 Stadium music is on.' : '🔇 Music is off.');
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[event.key] = true;
      keys[key] = true;

      detectKonamiCode(event.key);

      if (event.code === 'Space') {
        event.preventDefault();
        shootBall(1.25);
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[event.key] = false;
      keys[key] = false;
    });

    document.querySelectorAll('.touch-btn').forEach((btn) => {
      const key = btn.dataset.key;
      const setPress = (active) => {
        if (active) keys[key] = true;
        else keys[key] = false;
      };

      btn.addEventListener('pointerdown', () => setPress(true));
      btn.addEventListener('pointerup', () => setPress(false));
      btn.addEventListener('pointerleave', () => setPress(false));
      btn.addEventListener('pointercancel', () => setPress(false));
    });

    shootBtn.addEventListener('click', () => {
      shootBall(1.45);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          setStatus('⚠️ Service worker registration failed; app still works in browser mode.');
        });
      });
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      state.installPrompt = event;
      installBanner.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (!state.installPrompt) {
        setStatus('📲 Install is not available in this browser yet.');
        return;
      }
      state.installPrompt.prompt();
      await state.installPrompt.userChoice;
      installBanner.classList.remove('show');
      state.installPrompt = null;
    });

    restoreProgress();
    resetGame();
    renderScore();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
